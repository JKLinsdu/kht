[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kht"
version = "0.1.0"
description = "Fast keyed Hadamard transform for secure, similarity-preserving vector transformation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
include = ["kht*"]
